name: Update citation counts

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Semantic Scholar counts
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python .github/scripts/update_citations.py

      - name: Commit updated counts
        run: |
          if git diff --quiet -- data/citations.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git commit -m "chore: update citations"
          git push
